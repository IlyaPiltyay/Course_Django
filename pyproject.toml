[project]
name = "course-django"
version = "0.1.0"
description = ""
authors = [
    {name = "ilyap",email = "ilya.piltyay@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=5.2.5,<6.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "redis (>=6.4.0,<7.0.0)",
    "django-redis (>=6.0.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "course_django", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
